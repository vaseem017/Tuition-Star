<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Brand Navy Palette -->
    <linearGradient id="brandNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1e4e"/>
      <stop offset="100%" stop-color="#142c6e"/>
    </linearGradient>
    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0c1e4e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Graduation Cap + Achiever Crest) -->
  <g transform="translate(14, 10)" filter="url(#logoGlow)">
    <!-- Mortarboard Cap Diamond Top -->
    <path d="M 50 10 L 94 24 L 50 38 L 6 24 Z" fill="#0c1e4e" />
    <!-- Cap Underneath Depth & Rim Band -->
    <path d="M 22 28 L 50 38 L 78 28 L 78 33 L 50 43 L 22 33 Z" fill="#071330" />

    <!-- White Separation Gap Mask / Spacer -->
    <path d="M 16 38 Q 50 46 84 38" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.9" />

    <!-- Circular Ring Crest with Vertical Pinstripes -->
    <g transform="translate(0, 4)">
      <!-- Thick Outer Navy Ring -->
      <circle cx="50" cy="58" r="38" fill="none" stroke="#0c1e4e" stroke-width="7.5" />

      <!-- Vertical Background Pinstripes -->
      <g stroke="#1d4ed8" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
        <line x1="28" y1="46" x2="28" y2="70" />
        <line x1="33" y1="40" x2="33" y2="76" />
        <line x1="38" y1="36" x2="38" y2="80" />
        <line x1="43" y1="34" x2="43" y2="82" />
        <line x1="50" y1="33" x2="50" y2="83" />
        <line x1="57" y1="34" x2="57" y2="82" />
        <line x1="62" y1="36" x2="62" y2="80" />
        <line x1="67" y1="40" x2="67" y2="76" />
        <line x1="72" y1="46" x2="72" y2="70" />
      </g>

      <!-- Student Achiever Silhouette with Celebratory Uplifted Arms -->
      <!-- Head Dot -->
      <circle cx="50" cy="50" r="5.5" fill="#0c1e4e" />
      <!-- Torso & Uplifted Curved Wings/Arms -->
      <path
        d="M 27 58 C 32 58, 41 64, 45 67 L 45 81 C 45 82.5, 47.5 84, 50 84 C 52.5 84, 55 82.5, 55 81 L 55 67 C 59 64, 68 58, 73 58 C 75 58, 75 55, 72 55 C 64 56, 53 62, 50 64 C 47 62, 36 56, 28 55 C 25 55, 25 58, 27 58 Z"
        fill="#0c1e4e"
      />
    </g>
  </g>

  <!-- TYPOGRAPHIC WORDMARK "TuitionSTAR" -->
  <g transform="translate(126, 74)">
    <text
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="700"
      font-size="52"
      letter-spacing="-0.5px"
      fill="#0c1e4e"
    >
      Tuition<tspan font-weight="800" letter-spacing="1px" fill="#0c1e4e">STAR</tspan>
    </text>
  </g>
</svg>
